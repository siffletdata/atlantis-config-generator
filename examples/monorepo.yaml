# A worked example for a monorepo laid out like this:
#
#   infra/
#     .opentofu-version                        # "1.11.1"
#     environments/                            # root modules live here
#       clusters/<cluster>/base/               # cluster.s3.tfbackend
#       clusters/<cluster>/kubernetes/         # cluster.s3.tfbackend
#       clusters/<cluster>/tenants/<tenant>/   # tenant.s3.tfbackend
#       accounts/<provider>/<account>/<region>/<name>/
#       accounts/<provider>/<account>/<region>/common/   # region.s3.tfbackend
#     modules/                                 # library modules
#     templates/                               # shared files, symlinked into root modules
#     vendor/                                  # git submodule, often not checked out
#
# Generate with:
#   atlantis-config-generator -c examples/monorepo.yaml -o atlantis.yaml .

header_comment: |
  DO NOT EDIT.
  This file is generated by atlantis-config-generator. Edits will be lost.

scan:
  exclude:
    # A git submodule that is often not checked out.
    - "infra/vendor/**"

projects:
  # Confining projects to the environments tree is what keeps templates/ and
  # modules/ out of the project list. Both are still scanned, so they can still
  # be depended on. It also means a template with no current consumer -- which
  # is indistinguishable from a root module -- cannot be emitted by mistake.
  include:
    - "infra/environments/**"
  exclude:
    # Accounts and subtrees Atlantis has no credentials for. Excluding by
    # account number keeps the list stable as environments come and go.
    - "**/000000000000/**"
    - "**/111111111111/**"
    # Subtrees managed outside Atlantis.
    - "**/argocd"
    - "**/bootstrap"
    # Scratch environments that should never autoplan.
    - "**/clusters/*-sandbox-*/**"
    - "infra/environments/experimental/**"

  path_prefix: "./"
  terraform_version_file: "infra/.opentofu-version"

  when_modified:
    # Any change in the project directory or in any of its transitive
    # dependencies triggers a plan.
    self: ["**"]
    dependency: ["**"]

# First match wins. The regex is tested against the repository-relative
# directory, without path_prefix.
rules:
  - match: '/clusters/[^/]+/base$'
    workflow: cluster_base
  - match: '/clusters/[^/]+/kubernetes$'
    workflow: cluster_kubernetes
  - match: '/clusters/[^/]+/tenants/[^/]+$'
    workflow: tenant
  - match: '/accounts/[a-z]+/[0-9]{12}/[a-z0-9-]+/common$'
    workflow: region_common
  - match: '.*'
    workflow: default

output:
  version: 3
  parallel_plan: true
  parallel_apply: true

  workflows:
    # Every workflow gates apply behind the same check. Only the plan stage
    # differs, because each family of root modules uses its own partial
    # backend configuration.
    default:
      apply:
        steps:
          - run: ./scripts/check-apply-allowed.sh
          - apply

    cluster_base:
      apply:
        steps:
          - run: ./scripts/check-apply-allowed.sh
          - apply
      plan:
        steps:
          - init:
              extra_args: ["-backend-config=cluster.s3.tfbackend"]
          - plan

    cluster_kubernetes:
      apply:
        steps:
          - run: ./scripts/check-apply-allowed.sh
          - apply
      plan:
        steps:
          - init:
              extra_args: ["-backend-config=cluster.s3.tfbackend"]
          - plan

    tenant:
      apply:
        steps:
          - run: ./scripts/check-apply-allowed.sh
          - apply
      plan:
        steps:
          - init:
              extra_args: ["-backend-config=tenant.s3.tfbackend"]
          - plan

    region_common:
      apply:
        steps:
          - run: ./scripts/check-apply-allowed.sh
          - apply
      plan:
        steps:
          - init:
              extra_args: ["-backend-config=region.s3.tfbackend"]
          - plan
